<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: file:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Companion 控制面板</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="panel-shell">
      <header class="panel-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <div>
            <p class="eyebrow">COMPANION</p>
            <h1>伙伴面板</h1>
          </div>
        </div>
        <span id="app-state" class="status-pill">
          <span class="status-dot"></span>
          <span>连接中</span>
        </span>
      </header>

      <section class="companion-card" aria-labelledby="current-companion-title">
        <div class="pet-preview" aria-label="当前伙伴预览">
          <div class="preview-halo"></div>
          <img id="current-pet-preview" alt="" />
          <span id="preview-fallback" aria-hidden="true">✦</span>
        </div>
        <div class="companion-copy">
          <p class="section-kicker">当前伙伴</p>
          <h2 id="current-companion-title">载入中</h2>
          <p id="current-companion-id" class="companion-id">COMPANION</p>
          <div class="presence">
            <span class="presence-orb" aria-hidden="true"></span>
            <strong id="pet-presence">正在连接</strong>
          </div>
        </div>
      </section>

      <section class="panel-section" aria-labelledby="appearance-title">
        <div class="section-heading">
          <h2 id="appearance-title">外观</h2>
          <span>即时生效</span>
        </div>
        <div class="size-grid" role="group" aria-label="宠物大小">
          <button type="button" class="choice-card" data-pet-size="small">
            <span>小</span><strong>96</strong>
          </button>
          <button type="button" class="choice-card" data-pet-size="medium">
            <span>中</span><strong>128</strong>
          </button>
          <button type="button" class="choice-card" data-pet-size="large">
            <span>大</span><strong>160</strong>
          </button>
        </div>
        <div id="character-grid" class="character-grid" role="list" aria-label="可用伙伴"></div>
        <div class="mode-row">
          <div><strong>鼠标交互</strong><span>拖动伙伴或穿透点击</span></div>
          <div class="mode-control" role="group" aria-label="鼠标交互模式">
            <button type="button" data-mouse-mode="interactive">交互</button>
            <button type="button" data-mouse-mode="click-through">穿透</button>
          </div>
        </div>
      </section>

      <section class="panel-section interaction-section" aria-labelledby="interaction-title">
        <div class="section-heading">
          <h2 id="interaction-title">快速互动</h2>
          <span>由伙伴回应</span>
        </div>
        <div class="interaction-grid" role="group" aria-label="主动与伙伴互动">
          <button type="button" data-user-command="GREET" data-success-message="打招呼">
            <span aria-hidden="true">👋</span><strong>打招呼</strong>
          </button>
          <button type="button" data-user-command="CELEBRATE" data-success-message="庆祝">
            <span aria-hidden="true">🎉</span><strong>庆祝</strong>
          </button>
          <button type="button" data-user-command="ENCOURAGE" data-success-message="鼓励">
            <span aria-hidden="true">💪</span><strong>鼓励</strong>
          </button>
          <button type="button" data-user-command="REST" data-success-message="休息">
            <span aria-hidden="true">💤</span><strong>休息</strong>
          </button>
        </div>
      </section>

      <section class="panel-section control-section" aria-labelledby="control-title">
        <div class="presence-summary">
          <span id="visibility-dot" class="visibility-dot" aria-hidden="true"></span>
          <div>
            <h2 id="control-title">宠物显示中</h2>
            <p id="visibility-note">当前伙伴正在桌面陪伴</p>
          </div>
        </div>
        <button id="pet-visibility-action" type="button" class="visibility-action">
          隐藏宠物
        </button>
      </section>

      <section class="panel-section capability-section" aria-labelledby="capability-title">
        <div class="section-heading">
          <h2 id="capability-title">感知能力</h2>
          <span id="system-capability-state">连接中</span>
        </div>
        <div class="capability-row">
          <span id="system-capability" class="capability-chip capability-chip--active">系统状态</span>
          <span class="capability-chip">Git · 即将支持</span>
          <span class="capability-chip">VS Code · 未连接</span>
          <span class="capability-chip">Codex · 未连接</span>
        </div>
      </section>

      <section id="developer-control" class="developer-control">
        <button id="developer-toggle" type="button" aria-expanded="false">
          <span>Developer Mode</span>
          <span class="developer-state">关闭</span>
        </button>
        <div id="developer-panel" class="developer-panel" hidden>
          <div><span>Runtime</span><strong data-debug="runtime">读取中</strong></div>
          <div><span>CPU</span><strong data-listener="cpu">读取中</strong></div>
          <div><span>Memory</span><strong data-listener="memory">读取中</strong></div>
          <div><span>Battery</span><strong data-listener="battery">读取中</strong></div>
          <section class="event-simulator" aria-labelledby="event-simulator-title">
            <strong id="event-simulator-title">System Event Simulator</strong>
            <div class="event-simulator-grid">
              <button type="button" data-system-event="CPU_HIGH">CPU High</button>
              <button type="button" data-system-event="MEMORY_PRESSURE">Memory</button>
              <button type="button" data-system-event="BATTERY_LOW">Battery Low</button>
              <button type="button" data-system-event="TASK_RUNNING">Task Running</button>
              <button type="button" data-system-event="TASK_SUCCESS">Task Success</button>
              <button type="button" data-system-event="TASK_ERROR">Task Error</button>
            </div>
          </section>
        </div>
      </section>

      <output id="settings-status" aria-live="polite"></output>
    </main>
    <script type="module" src="./src/settings/settings.js"></script>
  </body>
</html>
